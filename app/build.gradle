apply plugin: 'com.android.application'

// Debug builds published from CI were hard to tell apart -- same versionCode/
// versionName on every push meant a device could be running a stale cached
// APK with no visible way to tell. GITHUB_RUN_NUMBER (always increasing) and
// GITHUB_SHA (exact commit) are only set in CI; local builds fall back to
// the static values below, unaffected.
def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
def ciShortSha = System.getenv("GITHUB_SHA") != null
        ? System.getenv("GITHUB_SHA").substring(0, 7) : null

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 37

    defaultConfig {
        applicationId 'org.pocketworkstation.pckeyboard'
        minSdkVersion 23
        targetSdkVersion 37
        versionCode ciRunNumber != null ? (1041001 + Integer.parseInt(ciRunNumber)) : 1041001
        versionName "v1.41.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            // Distinct applicationId + display name so a debug build can be
            // installed side by side with the Play Store release instead of
            // conflicting with it (same applicationId + different signing
            // key would otherwise make Android refuse the install).
            applicationIdSuffix '.codenameberyl'
            versionNameSuffix ciShortSha != null
                    ? "-codenameberyl-${ciShortSha}" : '-codenameberyl-local'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    productFlavors {
    }
    lint {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        //abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.emoji2:emoji2-emojipicker:1.6.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
