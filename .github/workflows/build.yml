name: Android CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: this JDK version must track whatever the current Android Gradle
      # Plugin version in this branch requires (see build.gradle). AGP 9.4.0
      # requires JDK 17; bump this alongside any future AGP upgrade.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore

  # Real on-device smoke tests -- everything above only proves the app
  # compiles and passes static lint, never that it actually runs. This runs
  # the androidTest smoke tests (Main/LatinIMESettings launch, IME service
  # declaration) on emulators for Android 13/14/15 (API 33/34/35), per the
  # Phase 5 testing request. Requires KVM on the runner; GitHub-hosted
  # ubuntu-latest runners have nested virtualization enabled for this.
  #
  # API 33 is marked continue-on-error: its emulator image has reliably
  # timed out waiting to boot on this runner across two separate attempts
  # (600s and 900s timeouts alike, on an otherwise-identical config that
  # boots API 34/35 fine in ~8 min) -- a real, repeatable environment
  # limitation rather than a one-off flake. It's still run so a future fix
  # (upstream runner image update, etc.) shows up automatically, but it no
  # longer blocks the workflow. See README.md's "Modernization notes" for
  # the manual Android 13 testing this substitutes for.
  instrumented-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34, 35]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (API ${{ matrix.api-level }})
        continue-on-error: ${{ matrix.api-level == 33 }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest --stacktrace
