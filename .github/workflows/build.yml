name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: this JDK version must track whatever the current Android Gradle
      # Plugin version in this branch requires (see build.gradle). AGP 9.4.0
      # requires JDK 17; bump this alongside any future AGP upgrade.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A rolling pre-release, re-published (same tag, assets replaced) on
      # every push to this branch, so there's always a downloadable APK on
      # the repo's Releases page without needing CI artifact access or a
      # local Android SDK. Gated to this branch specifically -- re-point
      # (or remove) this when merging to the default branch.
      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/claude/hackers-keyboard-modernize-cz10e9'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest debug build (auto-updated)
          prerelease: true
          body: |
            Automatically republished on every push to
            `claude/hackers-keyboard-modernize-cz10e9`. Currently built from
            commit ${{ github.sha }}.

            **This is an unsigned/debug-signed build for manual testing, not
            a Play Store release.** If you already have Hacker's Keyboard
            installed from the Play Store, you'll need to uninstall it first
            -- Android won't install this over it (different signing key,
            same package name).

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md)
            for what's changed, and the README's "Manual testing" section
            for what to check.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore

  # Real on-device smoke tests -- everything above only proves the app
  # compiles and passes static lint, never that it actually runs. This runs
  # the androidTest smoke tests (Main/LatinIMESettings launch, IME service
  # declaration) on emulators for Android 13/14/15 (API 33/34/35), per the
  # Phase 5 testing request. Requires KVM on the runner; GitHub-hosted
  # ubuntu-latest runners have nested virtualization enabled for this.
  #
  # API 33 is marked continue-on-error: its emulator image is slow/flaky to
  # boot on this runner (timed out twice at 600s/900s, then passed twice
  # more at 900s) while API 34/35 boot reliably in ~8 min every time. It
  # still runs so its actual pass/fail is visible, it just doesn't block
  # the workflow on a slow boot. See README.md's "Modernization notes".
  instrumented-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34, 35]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (API ${{ matrix.api-level }})
        continue-on-error: ${{ matrix.api-level == 33 }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest --stacktrace

  # A real, non-prerelease GitHub Release (as opposed to the rolling debug
  # prerelease above), cut by pushing a `vX.Y.Z` tag once build + tests are
  # green on that commit. This is *not* a Play Store submission -- the repo
  # owner opted for GitHub Releases only, self-signed via the RELEASE_*
  # secrets below rather than Play App Signing (see RELEASING.md for how
  # those secrets were generated and how to rotate them). If those secrets
  # aren't configured on this repo, this job still runs and produces an
  # unsigned APK exactly as it used to -- see the "Locate release APK" step.
  publish-stable-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, instrumented-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Populates RELEASE_KEYSTORE_PATH/RELEASE_KEYSTORE_PASSWORD/
      # RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD (read by app/build.gradle's
      # signingConfig) for every step after this one, via $GITHUB_ENV. The
      # presence check happens inside the shell script (not a step-level
      # if:) specifically so this step always runs and secrets never need
      # to be referenced from an if: condition. If the repo has no
      # RELEASE_KEYSTORE_BASE64 secret, this is a no-op and those env vars
      # simply stay unset -- build.gradle falls back to its unsigned
      # default, no separate "is this repo configured for signing" branch
      # needed anywhere else in this job.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret configured; release APK will be unsigned."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # AGP names the output app-release.apk once a real signingConfig is
      # applied, app-release-unsigned.apk otherwise -- find whichever one
      # actually got built rather than hardcoding one filename.
      - name: Locate release APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under app/build/outputs/apk/release" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          if [ "$(basename "$APK_PATH")" = "app-release.apk" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release (signed)
        if: steps.apk.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Hacker's Keyboard (by CodenameBeryl) ${{ github.ref_name }}"
          prerelease: false
          draft: false
          body: |
            Stable release ${{ github.ref_name }}, built from commit
            ${{ github.sha }}.

            The attached APK is signed and ready to install. If you already
            have a build of this app installed under a *different* signing
            key (e.g. a Play Store release, or a self-signed build from
            before this release's signing key existed), Android will refuse
            to install this over it -- uninstall the old one first.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md)
            for what's changed since upstream `v1.41.1`.
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release (unsigned)
        if: steps.apk.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Hacker's Keyboard (by CodenameBeryl) ${{ github.ref_name }}"
          prerelease: false
          draft: false
          body: |
            Stable release ${{ github.ref_name }}, built from commit
            ${{ github.sha }}.

            **The attached APK is unsigned** (this repo has no
            `RELEASE_KEYSTORE_BASE64` secret configured -- see
            RELEASING.md). Before you can install it, sign it yourself --
            see [RELEASING.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/RELEASING.md#installing-a-release-apk)
            for the one-command local signing step.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md)
            for what's changed since upstream `v1.41.1`.
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
