name: Android CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: this JDK version must track whatever the current Android Gradle
      # Plugin version in this branch requires (see build.gradle). AGP 9.4.0
      # requires JDK 17; bump this alongside any future AGP upgrade.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore

  # Real on-device smoke tests -- everything above only proves the app
  # compiles and passes static lint, never that it actually runs. This runs
  # the androidTest smoke tests (Main/LatinIMESettings launch, IME service
  # declaration) on emulators for Android 13/14/15 (API 33/34/35), per the
  # Phase 5 testing request. Requires KVM on the runner; GitHub-hosted
  # ubuntu-latest runners have nested virtualization enabled for this.
  instrumented-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34, 35]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Default is 600s; API 33's image hit that ceiling once (boot
          # started normally, just didn't finish in time) while 34/35 booted
          # fine in ~8 min under the same config -- give real headroom
          # instead of relying on a lucky re-run.
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest --stacktrace
