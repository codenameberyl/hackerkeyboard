# Use AndroidX package structure instead of the older support library.
android.useAndroidX=true
# This project has no Kotlin source; opt out of AGP 9's built-in Kotlin
# support to avoid an unnecessary Kotlin Gradle Plugin dependency.
android.builtInKotlin=false
